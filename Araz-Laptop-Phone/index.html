<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Araz Phone</title><style>body{margin:0;background:#eef4ff;font-family:Tahoma,Arial;display:grid;place-items:center;min-height:100vh;color:#17325c}.app{width:min(440px,92vw)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.phone{background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 40px #21437322}.status{font-size:12px;padding:7px 10px;border-radius:20px;background:#fff;border:1px solid #c9d8ee}.status.ok{color:#18794e}.screen{width:100%;box-sizing:border-box;padding:15px;border:2px solid #c9d8ee;border-radius:14px;font-size:22px;text-align:center;margin-bottom:12px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keypad button,.actions button{border:0;border-radius:15px;min-height:54px;font-size:20px;cursor:pointer}.keypad button{background:#edf3fb}.actions{display:grid;grid-template-columns:64px 1fr 90px;gap:10px;margin-top:12px}.call{background:#2c9b63;color:#fff}.hang{background:#d84c4c;color:#fff}.secondary{background:#e9eef5}.msg{text-align:center;color:#687d98;font-size:13px;min-height:20px;margin:12px 0}a{color:#2f63c9}</style></head>
<body><main class="app"><header><div><h1>📞 Araz Phone</h1><div>تلفن لپ‌تاپی</div></div><span id="state" class="status ok">آماده</span></header><section class="phone"><input id="num" class="screen" inputmode="tel" placeholder="+34123456789"><div class="keypad"> <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>*</button><button>0</button><button>#</button></div><div class="actions"><button class="secondary" id="del">⌫</button><button class="call" id="call">📞 تماس</button><button class="hang" id="hang" disabled>⏹ قطع</button></div><div class="msg" id="msg">نسخهٔ آماده است؛ اتصال مخابراتی هنوز فعال نشده.</div><div style="text-align:center"><a href="setup.html">⚙️ دستیار تنظیمات تماس</a></div></section></main><script>const n=document.getElementById('num'),m=document.getElementById('msg'),s=document.getElementById('state'),hang=document.getElementById('hang'),call=document.getElementById('call');document.querySelector('.keypad').onclick=e=>{if(e.target.tagName==='BUTTON')n.value+=e.target.textContent};document.getElementById('del').onclick=()=>n.value=n.value.slice(0,-1);call.onclick=()=>{if(!/^\+[1-9]\d{6,14}$/.test(n.value.trim())){m.textContent='شماره را با + و کد کشور وارد کن.';return} m.textContent='نسخهٔ نمایشی: تماس برای این نسخه واقعاً برقرار نمی‌شود.';s.textContent='نمایشی';call.disabled=true;hang.disabled=false};hang.onclick=()=>{m.textContent='تماس نمایشی پایان یافت.';s.textContent='آماده';call.disabled=false;hang.disabled=true}</script></body></html>
